<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 344" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#233e3d}.tiny{font-size:13px}.body{font-size:16px}.title{font-size:24px;font-weight:650}</style><rect width="100%" height="100%" fill="#f7f5ed"/><text x="24" y="35" font-size="24">G1 · 每一个轴肩摩擦支点：从固定侧向螺钉头看</text><text x="24" y="62" font-size="15">顺序示意，不按比例；一处 8 件标准件，活动叉耳夹在两片 M4 大垫之间。</text><rect x="24" y="106" width="100" height="92" rx="4" fill="#97a6af" stroke="#adc1b7"/><text x="28" y="135" font-size="12">M3 螺母</text><text x="28" y="167" font-size="10">1 枚</text><text x="125" y="155" font-size="14">→</text><rect x="136" y="106" width="100" height="92" rx="4" fill="#b8c1c4" stroke="#adc1b7"/><text x="140" y="135" font-size="12">M3 反力垫</text><text x="140" y="167" font-size="10">Ø9 × 0.8 · 1 片</text><text x="237" y="155" font-size="14">→</text><rect x="248" y="106" width="100" height="92" rx="4" fill="#759ba0" stroke="#adc1b7"/><text x="252" y="135" font-size="12">固定座反力壁</text><text x="252" y="167" font-size="10">打印件</text><text x="349" y="155" font-size="14">→</text><rect x="360" y="106" width="100" height="92" rx="4" fill="#b8c1c4" stroke="#adc1b7"/><text x="364" y="135" font-size="12">M4 大垫</text><text x="364" y="167" font-size="10">Ø12 × 1 · 1 片</text><text x="461" y="155" font-size="14">→</text><rect x="472" y="106" width="100" height="92" rx="4" fill="#e4a268" stroke="#adc1b7"/><text x="476" y="135" font-size="12">旋转叉耳</text><text x="476" y="167" font-size="10">打印件</text><text x="573" y="155" font-size="14">→</text><rect x="584" y="106" width="100" height="92" rx="4" fill="#b8c1c4" stroke="#adc1b7"/><text x="588" y="135" font-size="12">M4 大垫</text><text x="588" y="167" font-size="10">Ø12 × 1 · 1 片</text><text x="685" y="155" font-size="14">→</text><rect x="696" y="106" width="100" height="92" rx="4" fill="#d4b984" stroke="#adc1b7"/><text x="700" y="135" font-size="12">A8 碟簧 ×2</text><text x="700" y="167" font-size="10">相对、非同向套叠</text><text x="797" y="155" font-size="14">→</text><rect x="808" y="106" width="100" height="92" rx="4" fill="#b8c1c4" stroke="#adc1b7"/><text x="812" y="135" font-size="12">M4 普通垫</text><text x="812" y="167" font-size="10">Ø9 × 0.8 · 1 片</text><text x="909" y="155" font-size="14">→</text><rect x="920" y="106" width="100" height="92" rx="4" fill="#97a6af" stroke="#adc1b7"/><text x="924" y="135" font-size="12">轴肩螺钉</text><text x="924" y="167" font-size="10">Φ4×8 / M3 螺纹6</text><text x="24" y="238" font-size="17">先装螺母与反力垫，再装活动件；轴肩光杆穿活动叉耳，M3 螺纹进入捕获螺母。</text><text x="24" y="272" font-size="17">铰链做 1 处；十字核心做 4 处。两只传感器不等于只有两处支点。</text><text x="24" y="310" font-size="16">沿用已验证的 O11 垫片与碟簧方向，按手感调紧；本教程不增加冗余摩擦件。</text></svg>