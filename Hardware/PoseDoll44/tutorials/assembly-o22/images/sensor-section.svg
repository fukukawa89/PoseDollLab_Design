<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#233e3d}.tiny{font-size:13px}.body{font-size:16px}.title{font-size:24px;font-weight:650}</style><rect width="100%" height="100%" fill="#f7f5ed"/><text x="24" y="38" font-size="24">G4 · 磁铁与传感板安装朝向</text><text x="24" y="66" font-size="15">侧剖示意；目标间隙指磁铁表面到 IC 封装顶面，不是 PCB 表面。</text><rect x="65" y="110" width="230" height="48" rx="4" fill="#d98e65" stroke="#adc1b7"/><text x="81" y="140" font-size="15">旋转件 + Φ6×2.5 径向磁铁</text><rect x="121" y="218" width="118" height="32" rx="4" fill="#444e57" stroke="#adc1b7"/><text x="131" y="239" font-size="16" style="fill:#fff">MT6701</text><rect x="55" y="253" width="250" height="14" rx="4" fill="#75a39a" stroke="#adc1b7"/><text x="325" y="267" font-size="16">PCB：12 × 10 × 1 mm</text><path d="M181,159 L181,216" stroke="#aa5b31" stroke-width="2" fill="none"/><text x="201" y="188" font-size="17">1.00–1.75 mm</text><text x="60" y="302" font-size="18">器件面朝磁铁，中心轴对齐</text><text x="480" y="125" font-size="16">磁铁侧壁少量非导电胶：防止磁铁自转</text><text x="480" y="165" font-size="16">胶完全固化后再固定磁铁座盖</text><text x="480" y="205" font-size="16">板托夹滑入口保持通畅，线从开口端引出</text><text x="480" y="245" font-size="16">不要把胶涂到芯片顶面或运动间隙</text><text x="480" y="285" font-size="16">卡扣让位后滑入；不靠压弯 PCB 强塞</text></svg>