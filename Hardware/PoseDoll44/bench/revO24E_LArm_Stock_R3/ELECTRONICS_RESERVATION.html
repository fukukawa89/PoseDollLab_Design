<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>R3 · 电子预留继承</title><style>body{margin:0;background:#f3f5f2;color:#243b35;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:30px}h1{font-size:32px}a{color:#116b61}nav a{margin-right:16px}.box{padding:18px;background:#deede5;border-left:4px solid #38866a;margin:20px 0}.warn{background:#fff0d9;border-color:#b87b29}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card,details{background:white;padding:16px;border-radius:6px}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{border:1px solid #cddbd3;padding:9px;text-align:left;vertical-align:top}code{overflow-wrap:anywhere}img{max-width:100%;max-height:640px;object-fit:contain}summary{cursor:pointer;font-weight:600}details{margin:12px 0}small{color:#63756c}</style><main><nav><a href="START_HERE.html">入口</a><a href="preview/index.html">单臂三维</a><a href="PRINTING.html">打印</a><a href="HARDWARE.html">五金</a><a href="ASSEMBLY.html">装配</a><a href="TEST_PLAN.html">试装记录</a></nav><h1>R3 · 电子预留继承</h1><p><a href="START_HERE.html">入口</a> · <a href="MERGE_REVIEW.html">分件审查</a> · <a href="PRINTING.html">重打清单</a> · <a href="HARDWARE.html">五金</a> · <a href="assembly_guide/index.html">逐步动画</a> · <a href="preview/index.html">整臂三维</a></p><p>本轮合并保留原腕角链、磁铁入口和6组传感器的空间预留；一体手掌与原腕输出叉使用同一坐标系。电子刚体包络已针对R3再次检查。动态线束、电子支架、磁铁锁盖和角度标定仍未发布生产版，不需要安装它们来进行本次机械测试。</p><p>走线约束沿用6根AWG30、束径预留3.5 mm、动态弯曲半径至少10 mm；避开承压层、摩擦堆叠、捕获环唇和调节工具孔。腕板固定前臂，磁铁随一体掌部转动，角链仍为Ry(屈伸)·Rx(偏摆)。</p><p><a href="electronics/interface_reservations.json">预留坐标／板型／检查范围</a> · <a href="electronics/reserved_layout.glb">预留模型GLB</a></p></main></html>
