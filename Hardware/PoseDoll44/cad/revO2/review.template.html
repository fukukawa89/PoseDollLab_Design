<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoseDoll · Rev O 第二轮</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f4;color:#203641;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#163541;color:#f3f8f8;padding:25px 32px}header small{color:#8cc8c2;letter-spacing:.15em}h1{font-size:25px;margin:8px 0}p{line-height:1.7}header p{max-width:1050px;margin:4px 0;color:#cadbdd}main{max-width:1420px;margin:auto;padding:22px}nav,.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}button,select{font:inherit;padding:8px 12px;border:1px solid #bac9ce;border-radius:5px;background:white;color:#173e49;cursor:pointer}button[aria-selected=true]{background:#247b78;color:white;border-color:#247b78}input{accent-color:#247b78}a{color:#126e7a}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c38820;outline-offset:3px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:22px}.panel{background:white;border:1px solid #cfdbdf;border-radius:9px;overflow:hidden}canvas{width:100%;height:610px;display:block;touch-action:none}.caption{padding:10px 15px;background:#e5ecee;font-size:13px;line-height:1.6}aside{min-width:0;line-height:1.65}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:20px 0 9px}.pill{padding:3px 7px;background:#eee1ce;color:#795416;font-size:12px;border-radius:3px}.bad{background:#f2dfd8;color:#963d24}.good{background:#dceee5;color:#267055}.cards{display:flex;gap:12px;margin:15px 0}.card{background:white;flex:1;border:1px solid #d1dce1;border-radius:6px;padding:13px}.value{font-size:25px;font-variant-numeric:tabular-nums}.muted{font-size:13px;color:#637782}ul{padding-left:19px;line-height:1.8}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{padding:9px;text-align:left;border-bottom:1px solid #d8e0e4;vertical-align:top}th{background:#e3e9ec}.hidden{display:none!important}.alert{border-left:3px solid #c37953;padding:9px 12px;background:#f7eae1}footer{margin-top:25px;border-top:1px solid #ccd8dd;padding-top:15px;color:#69808a;font-size:12px}label{display:flex;gap:5px;align-items:center}#stepRange{width:180px}@media(max-width:950px){.grid{grid-template-columns:1fr}canvas{height:490px}header{padding:20px}main{padding:15px}}@media(max-width:500px){canvas{height:430px}h1{font-size:22px}.cards{flex-wrap:wrap}.card{min-width:130px}}
</style>
<header><small>POSEDOLL / REV O / ITERATION 2</small><h1>把装配、空间和证据逐项落实</h1><p>保留 91 cm 备用方案。主线继续以 480 mm 为参考，保留 41 个测量轴、44 个协议槽位及外置 G0。本页展示本轮实际生成的数据；完整整机、实物测量与制造放行仍未完成。</p></header>
<main><nav><button data-tab="joint" aria-selected="true">L6 分体关节</button><button data-tab="boards">原生板件排布</button><button data-tab="body">480 mm 空间检查</button><button data-tab="evidence">结果与缺口</button></nav>
<section id="visual"><div class="controls" id="jointControls"><label><input id="explode" type="checkbox">爆炸视图</label><label><input id="hideHousing" type="checkbox">隐藏壳体</label><label>装配步骤 <input id="stepRange" type="range" min="0" max="1" value="1"></label><button id="reset">复位视角</button></div>
<div class="controls hidden" id="boardControls"><label>板件 <select id="board"><option value="proximal5">胸腔五路 · 36×48</option><option value="distal4">远端四路 · 26×30</option><option value="distal4_narrow">窄版四路 · 20×36</option></select></label><label><select id="pcbSide"><option value="front">正面</option><option value="back">背面</option></select></label></div>
<div class="controls hidden" id="bodyControls"><label>角色 <select id="character"><option value="manny">Manny</option><option value="quinn">Quinn</option></select></label><label>上臂候选 <select id="variant"><option value="distal4_narrow">20×36 窄板</option><option value="distal4">26×30 初稿</option></select></label><button id="front">正面</button></div>
<div class="grid"><div class="panel"><canvas id="canvas" aria-label="可拖动旋转的当前设计数据"></canvas><div class="caption" id="caption">正在读取当前运行的数据…</div></div><aside id="detail" aria-live="polite"></aside></div></section>
<section id="evidence" class="hidden"><h2>本轮状态</h2><div id="summary"></div><div class="scroll"><table><thead><tr><th>门槛</th><th>状态</th><th>含义</th></tr></thead><tbody id="gates"></tbody></table></div><h3>直接检查原始证据</h3><ul id="links"></ul><p class="alert">“执行成功”“零名义相交”和“ERC 通过”各自只覆盖一个检查范围。它们不会自动变成整机合格、精度达标或制造许可。</p></section>
<footer id="runLabel"></footer></main>
<script>
const RUN=__RUN__,DATA=__DATA__;let tab='joint',yaw=.62,pitch=.22,zoom=1,drag=null;const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');let meshes,scene;const n=(v,d=2)=>Number(v).toFixed(d),badge=(t,good=false)=>`<span class="pill ${good?'good':'bad'}">${t}</span>`;
async function load(){[meshes,scene,DATA.status]=await Promise.all([fetch('joint/mesh.json').then(r=>r.json()),fetch('packaging_scene.json').then(r=>r.json()),fetch(DATA.reportRoot+'status.json').then(r=>r.json())]);$('#stepRange').max=DATA.assembly.steps.length;$('#stepRange').value=DATA.assembly.steps.length;$('#runLabel').textContent=`运行 ${RUN} · 所有尺寸为 mm · 不构成制造放行`;evidence();resize();window.REVIEW_READY=true;}
function resize(){canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);render()}
function project(p,center,scale){let [x,y,z]=p.map((v,i)=>v-center[i]),c=Math.cos(yaw),s=Math.sin(yaw),a=x*c-y*s,b=x*s+y*c;return [canvas.clientWidth/2+b*scale,canvas.clientHeight/2-(z*Math.cos(pitch)-a*Math.sin(pitch))*scale,a*Math.cos(pitch)+z*Math.sin(pitch)]}
function polygon(points,color,fill=true){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=color;ctx.fill()}else{ctx.strokeStyle=color;ctx.stroke()}}
function box(corners,projector,color){const q=corners.map(projector);ctx.lineWidth=1.4;for(let i=0;i<8;i++)for(let k=0;k<3;k++){let j=i^(1<<k);if(i<j){ctx.beginPath();ctx.moveTo(...q[i].slice(0,2));ctx.lineTo(...q[j].slice(0,2));ctx.strokeStyle=color;ctx.stroke()}}}
function render(){if(!meshes||!scene)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.fillStyle='#fbfcfc';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);if(tab==='joint')joint();if(tab==='boards')boards();if(tab==='body')body()}
function joint(){const count=+$('#stepRange').value,steps=DATA.assembly.steps,shown=new Set(steps.slice(0,count).flatMap(q=>q.parts));const explode=$('#explode').checked,hide=$('#hideHousing').checked,scale=Math.min(canvas.clientWidth/95,canvas.clientHeight/100)*zoom;let faces=[];
for(const m of meshes){if(!shown.has(m.name)||hide&&m.name.startsWith('housing'))continue;let off=[0,0,0];if(explode){if(m.name.endsWith('_L'))off[0]=-13;if(m.name.endsWith('_R'))off[0]=13;if(m.name.includes('cap')||m.name.includes('spring')||m.name.includes('washer'))off[2]=-14;if(m.name.startsWith('sensor')||m.name.startsWith('pcb'))off[2]=14}const v=m.vertices.map(p=>project(p.map((a,i)=>a+off[i]),[0,0,4],scale));for(const t of m.triangles){const p=t.map(i=>v[i]);faces.push({p,d:p.reduce((a,v)=>a+v[2],0)/3,c:m.color})}}
faces.sort((a,b)=>a.d-b.d);for(const f of faces){polygon(f.p,f.c);ctx.strokeStyle='#32495812';ctx.lineWidth=.35;ctx.stroke()}const j=DATA.joint,me=DATA.mechanics_analysis;
$('#caption').textContent=`拖动旋转 · 滚轮缩放。${explode?'爆炸图仅用于分辨零件，不代表装配路径。':'实体直接来自本轮 CAD。'} 装配显示 ${count}/${steps.length} 步：${count?steps[count-1].step:'尚未放入零件'}`;
$('#detail').innerHTML=`<h2>L6-R2 双面制动</h2>${badge('名义几何与采样路径通过',true)}<div class="cards"><div class="card"><div class="value">${n(j.modeled_mass_g)} g</div><small>${j.part_count} 个建模零件</small></div><div class="card"><div class="value">14 mm</div><small>双支承中心间距</small></div></div><p>分体衬套和止推件可径向装入。制动盘通过轴上的整体凸键传扭，测角轴由另一组止推面定位。单体制动杯承接后盖的 4 mm 螺纹重叠，中空扳手可绕开轴尾。</p><p class="alert">键连接名义角向空程约 ${n(me.tolerances.drive_key_nominal_lost_motion_deg)}°，已取消独立键的叠加间隙；配合公差、磨损和实测重复性仍待验证。</p><ul><li>48 零件均有材质、所属刚体与 CAD 质心。</li><li>326 N 为碟簧目录点，不能直接认定整机关节额定能力。</li><li>螺纹、夹紧变形、公差和精度待供应商及实物验证。</li></ul><p><a href="joint/L6_R2_assembly.step">关节装配 STEP</a> · <a href="${DATA.reportRoot}assembly.json">完整路径检查</a></p>`;
}
function boards(){const b=DATA.electronics.boards.find(x=>x.kind===$('#board').value),back=$('#pcbSide').value==='back',margin=24,top=b.kind==='proximal5'?-22:-2,w=b.board_mm[0],h=b.board_mm[1],scale=Math.min((canvas.clientWidth-70)/(w+16),(canvas.clientHeight-60)/(h-top+5));const xy=(x,y)=>[(canvas.clientWidth-w*scale)/2+x*scale,30+(y-top)*scale];const p=xy(0,0);ctx.fillStyle='#e5f1eb';ctx.fillRect(...p,w*scale,h*scale);ctx.strokeStyle='#428775';ctx.lineWidth=2;ctx.strokeRect(...p,w*scale,h*scale);ctx.font='11px system-ui';for(const c of b.components.filter(x=>x.back===back)){let r=c.courtyard_xy_mm,[x,y]=xy(r[0],r[1]);ctx.strokeStyle=c.ref==='U1'?'#bf714e':'#457792';ctx.fillStyle=c.ref.startsWith('J')?'#e2c88b88':'#aacbda77';ctx.fillRect(x,y,(r[2]-r[0])*scale,(r[3]-r[1])*scale);ctx.strokeRect(x,y,(r[2]-r[0])*scale,(r[3]-r[1])*scale);ctx.fillStyle='#203641';ctx.fillText(c.ref,x+2,y+12)}$('#caption').textContent='读取实际 KiCad 库封装的 courtyard 与正反面排布。主板上方扩展区域为天线空气禁布区。此图不是已完成布线的 PCB。';const d=b.checks.drc;
$('#detail').innerHTML=`<h2>${b.kind==='proximal5'?'胸腔五路主板':'上臂四路远端板'}</h2>${badge('ERC '+b.checks.erc.status,b.checks.erc.status==='PASS')} ${badge('DRC '+d.status)}<div class="cards"><div class="card"><div class="value">${w}×${h}</div><small>板框；器件保持实尺寸</small></div></div><p>${b.components.length} 个有封装的器件；${b.unplaced.length} 个未放置。正反面布置仍需电气布线与可制造性复核。</p><ul><li>未连接项：${d.unconnected_items}</li><li>DRC 错误：${d.severity_counts.error}；警告：${d.severity_counts.warning}</li><li>14 芯跨肩连接，250 kHz SPI；未验证热插拔与掉电隔离。</li><li>N3/N4 逻辑身份不变，八块内部采集 PCB；两种远端板是替代候选。</li></ul><p><a href="electronics/${b.kind}/PoseDoll_RevO2_${b.kind}.kicad_pcb">原生 PCB</a> · <a href="electronics/${b.kind}/PoseDoll_RevO2_${b.kind}.kicad_sch">原理图</a></p>`;
}
function body(){const ch=$('#character').value,s=scene[ch],scale=Math.min(canvas.clientWidth/260,canvas.clientHeight/535)*zoom,proj=p=>project(p,[0,0,240],scale);let triangles=s.surface_triangles.map(t=>{let p=t.map(i=>proj(s.surface_vertices[i]));return {p,d:p.reduce((a,v)=>a+v[2],0)/3}});triangles.sort((a,b)=>a.d-b.d);for(let i=0;i<triangles.length;i++)polygon(triangles[i].p,'#bbcbd229');let records=s.placements.filter(q=>!q.variant||q.variant===$('#variant').value);for(const q of records)box(q.corners_mm||q.best_surface_trial.corners_mm,proj,q.fit_status.startsWith('FAIL')?'#ad5735':'#2a8b7e');const mass=DATA.mass_properties_revO2.characters[ch];$('#caption').textContent='灰色为 Manny/Quinn 的实际参考表面。彩色框含板件、插头线尾和保护预留；这里只检查若干包络角点，不构成完整容纳、装拆或带线动作证明。';$('#detail').innerHTML=`<h2>${ch==='manny'?'Manny':'Quinn'} · 480 mm</h2>${badge('完整总装尚未闭合')}<p>已取消整块 66 mm 九路板放入上臂的布置。新的胸腔五路＋上臂四路方案仍有空间问题。</p><div class="scroll"><table><tr><th>板位</th><th>表面内角点</th></tr>${records.map(q=>`<tr><td>${q.node}</td><td>${q.inside_corners??q.best_surface_trial.inside_corners}/8</td></tr>`).join('')}</table></div><p>分项预算 <b>${n(mass.total_budget_g,0)} g</b>，目标 1200 g。预算包含未建模分配；不是整机 CAD 质量或实称。</p><p>头俯仰载荷 ${n(mass.head_pitch_check.max_abs_gravity_contact_Nm,4)} N·m，已按非零质心计算。支撑反力分析涵盖站立、坐跪和卧姿，真实接触几何仍待补齐。</p>`;
}
function evidence(){let st=DATA.status;$('#summary').innerHTML=`<p>91 cm 备用完整性：${badge(st.fallback_91cm_preserved?'本轮哈希验证通过':'查看验证记录',st.fallback_91cm_preserved)}　实物与制造：${badge('未测试 / 未放行')}</p>`;let names={V0:'当前输入、结果与完整记录集',V1:'装拆路径与承力',V2:'真实 PCBA、线束与空间',V3:'保持力、精度和实物关节',V4:'电气及七节点时序',V5:'多轴总装、实际配置与 UE'};$('#gates').innerHTML=Object.entries(st.gates).map(([k,v])=>`<tr><td>${k} · ${names[k]}</td><td>${badge(v.status,v.status==='PASS')}</td><td>${(v.blocking||v.requires||[v.scope||v.physical_tests||v.full_body_and_UE||'待完整验证']).join('；')}</td></tr>`).join('');$('#links').innerHTML=DATA.links.map(q=>`<li><a href="${q.href}">${q.label}</a></li>`).join('')}
for(const btn of document.querySelectorAll('nav button'))btn.onclick=()=>{tab=btn.dataset.tab;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b===btn));$('#visual').classList.toggle('hidden',tab==='evidence');$('#evidence').classList.toggle('hidden',tab!=='evidence');$('#jointControls').classList.toggle('hidden',tab!=='joint');$('#boardControls').classList.toggle('hidden',tab!=='boards');$('#bodyControls').classList.toggle('hidden',tab!=='body');zoom=1;resize()};
for(const e of document.querySelectorAll('select,input'))e.oninput=render;$('#reset').onclick=()=>{yaw=.62;pitch=.22;zoom=1;render()};$('#front').onclick=()=>{yaw=0;pitch=0;zoom=1;render()};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag||tab==='boards')return;yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.006;drag=[e.clientX,e.clientY];render()};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.6,zoom*Math.exp(-e.deltaY*.001)));render()};window.addEventListener('resize',resize);load().catch(e=>{$('#caption').textContent='加载失败：'+e.message;throw e});
</script></html>
